# Hoops Lab background collector: saves scores, lines, projections and results for every D1 game.
# Runs every 5 minutes from about 10am to 3am Eastern. History is saved to the "data" branch.
name: Hoops Lab collector

on:
  schedule:
    - cron: '*/5 0-7,15-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoops-lab-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load saved history
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch -q --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
          fi

      - name: Collect games, lines and projections
        env:
          ODDS_PROXY_URL: ${{ vars.ODDS_PROXY_URL }}
          PREFERRED_BOOK: ${{ vars.PREFERRED_BOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_TOTAL_EDGE: ${{ vars.ALERT_TOTAL_EDGE }}
          ALERT_SPREAD_EDGE: ${{ vars.ALERT_SPREAD_EDGE }}
          ALERT_MIN_PROB: ${{ vars.ALERT_MIN_PROB }}
          ALERT_PREGAME: ${{ vars.ALERT_PREGAME }}
          ODDS_LIVE_EVERY_MIN: ${{ vars.ODDS_LIVE_EVERY_MIN }}
          ODDS_PREGAME_EVERY_MIN: ${{ vars.ODDS_PREGAME_EVERY_MIN }}
          FIRST_HALF_DAILY_CAP: ${{ vars.FIRST_HALF_DAILY_CAP }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          cat > /tmp/collector.js <<'HOOPS_EOF'
          // Hoops Lab background collector — runs in GitHub Actions every 5 minutes during game hours.
          // Reuses the dashboard's own data + model code from index.html, and saves history to the "data" branch.
          const fs = require('fs'), path = require('path');
          const DATA = path.resolve(process.env.DATA_DIR || 'data');
          fs.mkdirSync(path.join(DATA, 'days'), { recursive: true });
          const readJ = (f, d) => { try { return JSON.parse(fs.readFileSync(path.join(DATA, f), 'utf8')); } catch { return d; } };
          const writeJ = (f, v) => fs.writeFileSync(path.join(DATA, f), JSON.stringify(v));
          const env = k => (process.env[k] || '').trim();
          const numEnv = (k, d) => { const v = parseFloat(env(k)); return isFinite(v) ? v : d; };

          // localStorage stand-in, saved between runs (caches team history so it isn't re-downloaded every run)
          const cache = readJ('cache.json', {});
          for (const [k, v] of Object.entries(cache)) { try { if (Date.now() - JSON.parse(v).t > 15 * 86400e3) delete cache[k]; } catch { delete cache[k]; } }
          globalThis.localStorage = { getItem: k => (k in cache ? cache[k] : null), setItem: (k, v) => { cache[k] = String(v); }, removeItem: k => { delete cache[k]; } };

          const html = fs.readFileSync(env('INDEX_PATH') || 'index.html', 'utf8');
          const core = html.slice(html.indexOf('<script>') + 8, html.indexOf('/*@@CORE_END@@*/'));
          if (core.length < 1000) throw new Error('Could not find the dashboard code in index.html (missing @@CORE_END@@ marker?)');
          const H = new Function(core + '\nreturn { S, fetchScoreboard, fetchSummary, loadPrior, loadStandings, currentSeason, project, fetchProxyOdds, fetchH1Lines, currentLine, gameElapsed, estPoss, LEAGUE, gameEvents, badBeats, clutchStats, rotation, playerAdvanced, possSegments, nonGarbage, shotBinCounts, applyCalib, CAL, CAL_DEFAULTS, LUCK_SHARE };')();
          const { S } = H;
          S.settings.book = env('PREFERRED_BOOK') || 'fanduel';
          S.settings.sims = 1000;

          const etDate = d => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
          const etHour = +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hour12: false }).format(new Date()) % 24;
          const today = etDate(new Date());
          const daysToRun = etHour < 7 ? [etDate(new Date(Date.now() - 86400e3)), today] : [today];
          const forced = env('RUN_DATE'); if (forced) daysToRun.splice(0, daysToRun.length, forced);

          const CPS = [['Pregame', 0], ['Halftime', 1200], ['10:00 left', 1800], ['5:00 left', 2100], ['2:00 left', 2280]];
          const status = { lastRun: new Date().toISOString(), days: daysToRun, live: 0, games: 0, snaps: 0, odds: 0, alerts: 0, errors: [] };
          const perf = readJ('perf.json', []);
          const perfIds = new Set(perf.map(r => r.gid));
          let priorBudget = 120; // max new team-history downloads per run
          const STATE = readJ('state.json', { lastOddsPull: 0, eventIds: {}, lastExtra: {} });
          const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
          const nextDay = d => { const [y, m, dd] = d.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, dd + 1)); return t.toISOString().slice(0, 10); };

          /* ---------- Season game log + opponent-adjusted ratings ---------- */
          /* ---------- season player totals (box + on/off) for player impact ratings ---------- */
          let PLAYERS = null;
          function addPlayers(g, det){
            if (!PLAYERS || !det.pH || !det.pA) return;
            let rot = null; try { rot = H.rotation(det, Object.assign({}, g, { status: 'post' })); } catch {}
            for (const [sd, P, tid] of [['h', det.pH, g.home.id], ['a', det.pA, g.away.id]]){
              const adv = H.playerAdvanced(P) || {}, sp = v => v && String(v).includes('-') ? String(v).split('-').map(Number) : [0, 0];
              const rmap = {}; if (rot && rot.available) for (const x of rot[sd]) rmap[x.id] = x;
              const T = rot && rot.available ? rot.team[sd] : null;
              for (const r of P.rows){ if (r.dnp || !r.id) continue; const v = r.v, mn = Number(v.MIN) || 0; if (!mn) continue;
                const q = PLAYERS.players[r.id] = PLAYERS.players[r.id] || { n: r.name, t: tid, pos: r.pos, gp: 0, min: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, to: 0, pf: 0, fgm: 0, fga: 0, tpm: 0, tpa: 0, ftm: 0, fta: 0, gs: 0, on: { sec: 0, pf: 0, pa: 0, op: 0, dp: 0 }, tm: { sec: 0, pf: 0, pa: 0, op: 0, dp: 0 } };
                q.n = r.name; q.t = tid; q.gp++; q.min += mn; q.pts += Number(v.PTS) || 0; q.reb += Number(v.REB) || 0; q.ast += Number(v.AST) || 0; q.stl += Number(v.STL) || 0; q.blk += Number(v.BLK) || 0; q.to += Number(v.TO) || 0; q.pf += Number(v.PF) || 0;
                const [fm, fa] = sp(v.FG), [tm, ta] = sp(v['3PT']), [xm, xa] = sp(v.FT); q.fgm += fm; q.fga += fa; q.tpm += tm; q.tpa += ta; q.ftm += xm; q.fta += xa; q.gs += adv[r.id]?.gmsc || 0;
                const x = rmap[String(r.id)]; if (x && T){ q.on.sec += x.secOn; q.on.pf += x.pf; q.on.pa += x.pa; q.on.op += x.o.poss; q.on.dp += x.d.poss; q.tm.sec += T.sec; q.tm.pf += T.pf; q.tm.pa += T.pa; q.tm.op += T.o.poss; q.tm.dp += T.d.poss; }
              }
            }
          }
          function computeImpacts(){
            const list = Object.values(PLAYERS.players); let w = 0, s = 0;
            for (const p of list) if (p.min >= 100){ s += p.gs/p.min*40*p.min; w += p.min; }
            const lgGs40 = w ? s/w : 13;
            for (const p of list){
              p.mpg = p.gp ? +(p.min/p.gp).toFixed(1) : 0;
              const box = p.min >= 20 ? (p.gs/p.min*40 - lgGs40)*0.6 : null;
              let oo = null; const offOp = p.tm.op - p.on.op, offDp = p.tm.dp - p.on.dp;
              if (p.on.op >= 40 && p.on.dp >= 40 && offOp >= 20 && offDp >= 20){
                const on = (p.on.pf/p.on.op - p.on.pa/p.on.dp)*100, off = ((p.tm.pf - p.on.pf)/offOp - (p.tm.pa - p.on.pa)/offDp)*100;
                const k = Math.min(p.on.op, offOp)/(Math.min(p.on.op, offOp) + 300); oo = (on - off)*k; p.onNet = +on.toFixed(1); p.offNet = +off.toFixed(1); }
              p.box = box == null ? null : +box.toFixed(2); p.oo = oo == null ? null : +oo.toFixed(2);
              p.imp = box == null ? null : +Math.max(-15, Math.min(15, oo == null ? box*0.8 : 0.5*box + 0.5*oo)).toFixed(2);
            }
            PLAYERS.lgGs40 = +lgGs40.toFixed(2);
          }

          /* ---------- availability (injury report) + schedule spots for upcoming games ---------- */
          function availFor(det, teamId){
            const inj = (det && det.injuries || []).find(t => t.team === teamId); if (!inj || !PLAYERS) return { delta: 0, out: [] };
            let delta = 0; const out = [];
            for (const it of inj.items || []){
              const st = String(it.status || ''); const wgt = /out|suspend|inactive/i.test(st) ? 1 : /doubt/i.test(st) ? 0.8 : /question|day-to-day|game.?time/i.test(st) ? 0.4 : 0;
              const p = PLAYERS.players[it.id] || Object.values(PLAYERS.players).find(q => q.t === teamId && q.n === it.name);
              const d = p && p.imp != null && p.gp ? -p.imp*Math.min(1, p.mpg/40)*wgt : 0;
              delta += d; out.push({ name: it.name, status: st, imp: p ? p.imp : null, mpg: p ? p.mpg : null, d: +d.toFixed(2) });
            }
            return { delta: +Math.max(-12, Math.min(12, delta)).toFixed(2), out };
          }
          function teamGamesBefore(teamId, day){ return LOG.games.filter(x => (x.h === teamId || x.a === teamId) && x.day < day).sort((a, b) => a.day < b.day ? -1 : 1); }
          function daysBetween(a, b){ return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z'))/86400e3); }
          function spotInfo(teamId, day, isAway, neutral){
            const prev = teamGamesBefore(teamId, day); const last = prev[prev.length - 1];
            const rest = last ? daysBetween(last.day, day) - 1 : null;
            let road = isAway && !neutral ? 1 : 0; if (road) for (let i = prev.length - 1; i >= 0; i--){ const x = prev[i]; if (x.a === teamId && !x.n) road++; else break; }
            const g7 = prev.filter(x => daysBetween(x.day, day) <= 7).length;
            return { rest, road, g7 };
          }
          const restBucket = d => d == null ? null : d <= -2 ? '≤-2' : d >= 2 ? '≥+2' : (d > 0 ? '+' : '') + d;
          const roadBucket = r => r >= 3 ? '3+' : String(r);
          function spotAdj(sh, sa){
            const C = CALIB && CALIB.spots; if (!C) return 0; let adj = 0;
            if (sh.rest != null && sa.rest != null){ const b = C.rest[restBucket(Math.max(-3, Math.min(3, sh.rest - sa.rest)))]; if (b) adj += b.eff*b.n/(b.n + 200); }
            if (sa.road >= 1){ const b = C.road[roadBucket(sa.road)]; if (b) adj += b.eff*b.n/(b.n + 200); }
            return +adj.toFixed(2);
          }
          let CALIB = null;

          function addLog(LOG, ids, g, det, day){
            if (ids.has(g.gid) || !det || !det.hasBox) return;
            const hp = H.estPoss(det.totH), ap = H.estPoss(det.totA);
            if (!hp || !ap || g.home.score == null || g.away.score == null) return;
            const box = t => ({ fga: t.fga, fgm: t.fgm, tpm: t.tpm, tpa: t.tpa, fta: t.fta, ftm: t.ftm, to: t.to, orb: t.orb, drb: t.drb });
            let cl = null; try { const c = H.clutchStats(det, g); if (c && c.any) cl = { hp: c.h.pts, ap: c.a.pts, hpos: c.h.poss, apos: c.a.poss, sec: Math.round(c.sec) }; } catch {}
            let gt = null, tr = null, sq = null;
            try { gt = H.nonGarbage(det, g); } catch {}
            try { const ps = H.possSegments(det, g); if (ps) tr = ps; } catch {}
            try { const sh = H.shotBinCounts(det.plays, g.home.id), sa = H.shotBinCounts(det.plays, g.away.id); if (Object.keys(sh).length || Object.keys(sa).length) sq = { h: sh, a: sa }; } catch {}
            LOG.games.push({ gid: g.gid, day, h: g.home.id, a: g.away.id, hs: g.home.score, as: g.away.score, hp: +hp.toFixed(1), ap: +ap.toFixed(1), n: g.neutral ? 1 : 0, ot: g.period > 2 ? g.period - 2 : 0,
              h1: [g.home.lines[0] ?? null, g.away.lines[0] ?? null], h2: [g.home.lines[1] ?? null, g.away.lines[1] ?? null], bh: box(det.totH), ba: box(det.totA), cl, gt, tr, sq });
            try { addPlayers(g, det); } catch (e){ status.errors.push('players ' + g.gid + ': ' + e.message); }
            ids.add(g.gid);
          }
          async function backfillLog(LOG, ids){
            const season = LOG.season; let budget = 70, dates = 0;
            for (let d = `${season - 1}-11-01`; d < today && dates < 5 && budget > 0; d = nextDay(d)){
              if (LOG.done[d]) continue; dates++;
              let list; try { list = await H.fetchScoreboard(d); } catch (e){ status.errors.push(`backfill ${d}: ${e.message}`); continue; }
              const todo = list.filter(g => g.status === 'post' && !ids.has(g.gid));
              const take = todo.slice(0, budget); budget -= take.length;
              for (const g of take) S.games.set(g.gid, g);
              await Promise.all(take.map(g => H.fetchSummary(g.gid).then(det => addLog(LOG, ids, g, det, d)).catch(() => {})));
              if (take.length === todo.length) LOG.done[d] = true;
              status.backfilled = (status.backfilled || 0) + take.length;
            }
          }
          function prevSeasonStats(id, season){ try { return JSON.parse(cache[`hl.ts.${id}.${season - 1}`]).v || null; } catch { return null; } }
          function computeRatings(LOG, asOf = null, light = false){
            const d1 = new Set(S.conf.keys());
            const games = LOG.games.filter(x => (!d1.size || (d1.has(x.h) && d1.has(x.a))) && x.hp && x.ap && (!asOf || x.day <= asOf));
            // garbage-time filter: use only possessions before the game was decided (when play-by-play allows)
            const useGT = x => x.gt && x.gt.hpos >= 20 && x.gt.apos >= 20;
            for (const x of games){ if (useGT(x)){ x._hs = x.gt.hs; x._as = x.gt.as; x._hp = x.gt.hpos; x._ap = x.gt.apos; } else { x._hs = x.hs; x._as = x.as; x._hp = x.hp; x._ap = x.ap; } }
            const possOf = x => (x._hp + x._ap) / 2;
            const fullPoss = x => (x.hp + x.ap) / 2; // tempo always uses the whole game (garbage-time filter is for efficiency only)
            let pts = 0, ps = 0; for (const x of games){ pts += x._hs + x._as; ps += 2 * possOf(x); }
            const lgEff = games.length > 40 ? pts / ps * 100 : H.LEAGUE.eff;
            const lgT = games.length > 40 ? mean(games.map(x => fullPoss(x) * 40 / (40 + 5 * x.ot))) : H.LEAGUE.pace;
            const teams = new Set([...d1, ...games.flatMap(x => [x.h, x.a])]);
            const hcaEff = (H.LEAGUE.hcaPts / 2) / lgT * 100;
            const K = 3; // last season counts as 3 games (backtest: current-season results should take over faster), so current-season results take over within a few weeks
            const prior = {};
            for (const id of teams){ const p = prevSeasonStats(id, LOG.season); const reg = (v, m) => v == null || !isFinite(v) ? m : m + 0.65 * (v - m);
              prior[id] = { o: reg(p && p.ortg, lgEff), d: reg(p && p.drtg, lgEff), t: reg(p && p.pace, lgT), known: !!p }; }
            const byTeam = {}; for (const x of games){ (byTeam[x.h] = byTeam[x.h] || []).push(x); (byTeam[x.a] = byTeam[x.a] || []).push(x); }
            let R = {}; for (const id of teams) R[id] = Object.assign({}, prior[id]);
            const nowT = asOf ? Date.parse(asOf + 'T23:59:00Z') : Date.now();
            for (let it = 0; it < 30; it++){
              const N = {};
              for (const id of teams){
                const pr = prior[id]; let O = pr.o * K, D = pr.d * K, T = pr.t * K, W = K;
                for (const x of byTeam[id] || []){
                  const home = x.h === id, opp = home ? x.a : x.h, op = R[opp] || { o: lgEff, d: lgEff, t: lgT };
                  const mins = (40 + 5 * x.ot) / 40, poss = possOf(x);
                  const ortg = (home ? x._hs : x._as) / poss * 100, drtg = (home ? x._as : x._hs) / poss * 100;
                  const adj = x.n ? 0 : (home ? hcaEff : -hcaEff);
                  const age = (nowT - Date.parse(x.day + 'T12:00:00Z')) / 86400e3, w = Math.pow(0.5, Math.max(0, age) / 45);
                  O += w * (ortg - adj) * lgEff / op.d; D += w * (drtg + adj) * lgEff / op.o; T += w * (fullPoss(x) / mins) * lgT / op.t; W += w;
                }
                N[id] = { o: O / W, d: D / W, t: T / W };
              }
              R = N;
            }
            if (light){ const out = {}; [...teams].filter(id => d1.has(id) || !d1.size).sort((a, b) => (R[b].o - R[b].d) - (R[a].o - R[a].d)).forEach((id, i) => out[id] = [+(R[id].o - R[id].d).toFixed(2), i + 1, +R[id].o.toFixed(1), +R[id].d.toFixed(1), +R[id].t.toFixed(1)]); return { games: games.length, teams: out }; }
            // Season profiles: strength of schedule, clutch, halftime adjustment, four factors (offense & defense)
            const prof = {};
            const P = id => prof[id] = prof[id] || { sos: [], cl: { pf: 0, pa: 0, pos: 0, opos: 0, g: 0, w: 0, l: 0 }, h1: [], h2: [], o: { fga: 0, fgm: 0, tpm: 0, fta: 0, to: 0, orb: 0, oppDrb: 0, poss: 0 }, d: { fga: 0, fgm: 0, tpm: 0, fta: 0, to: 0, orb: 0, oppDrb: 0, poss: 0 } };
            for (const x of games){
              for (const [me, op, home] of [[x.h, x.a, true], [x.a, x.h, false]]){
                const q = P(me), r = R[op]; if (r) q.sos.push(r.o - r.d);
                if (x.cl){ const pf = home ? x.cl.hp : x.cl.ap, pa = home ? x.cl.ap : x.cl.hp, pos = home ? x.cl.hpos : x.cl.apos, opos = home ? x.cl.apos : x.cl.hpos;
                  q.cl.pf += pf; q.cl.pa += pa; q.cl.pos += pos; q.cl.opos += opos; q.cl.g++; const won = home ? x.hs > x.as : x.as > x.hs; won ? q.cl.w++ : q.cl.l++; }
                if (x.h1 && x.h1[0] != null && x.h2 && x.h2[0] != null){ q.h1.push(home ? x.h1[0] - x.h1[1] : x.h1[1] - x.h1[0]); q.h2.push(home ? x.h2[0] - x.h2[1] : x.h2[1] - x.h2[0]); }
                const mb = home ? x.bh : x.ba, ob = home ? x.ba : x.bh;
                if (mb && ob && mb.fga != null && ob.fga != null){ const add = (t, b, oppB) => { t.fga += b.fga || 0; t.fgm += b.fgm || 0; t.tpm += b.tpm || 0; t.fta += b.fta || 0; t.to += b.to || 0; t.orb += b.orb || 0; t.oppDrb += oppB.drb || 0; t.poss += possOf(x); };
                  add(q.o, mb, ob); add(q.d, ob, mb); }
              }
            }
            // opponent-adjusted Four Factors (additive adjustment for opponent strength in each factor, iterated)
            const FK = ['efg', 'tov', 'orb', 'ftr'];
            const gameFF = (mb, ob, poss) => mb && ob && mb.fga ? { efg: (mb.fgm + 0.5*mb.tpm)/mb.fga, tov: poss ? mb.to/poss : null, orb: (mb.orb + ob.drb) ? mb.orb/(mb.orb + ob.drb) : null, ftr: mb.fta/mb.fga } : null;
            const ffGames = []; for (const x of games){ const ph = gameFF(x.bh, x.ba, x.hp), pa = gameFF(x.ba, x.bh, x.ap); if (ph && pa) ffGames.push({ h: x.h, a: x.a, ph, pa }); }
            const lgF = {}; for (const k of FK){ const v = ffGames.flatMap(f => [f.ph[k], f.pa[k]]).filter(v => v != null); lgF[k] = v.length ? mean(v) : null; }
            let AO = {}, AD = {}; for (const id of teams){ AO[id] = Object.assign({}, lgF); AD[id] = Object.assign({}, lgF); }
            const ffBy = {}; for (const f of ffGames){ (ffBy[f.h] = ffBy[f.h] || []).push({ me: f.ph, op: f.pa, opp: f.a }); (ffBy[f.a] = ffBy[f.a] || []).push({ me: f.pa, op: f.ph, opp: f.h }); }
            for (let it = 0; it < 12; it++){ const NO = {}, ND = {};
              for (const id of teams){ NO[id] = {}; ND[id] = {}; for (const k of FK){ let so = 0, sd = 0, n = 0;
                for (const e of ffBy[id] || []){ if (e.me[k] == null || e.op[k] == null || lgF[k] == null) continue; so += e.me[k] - (AD[e.opp][k] - lgF[k]); sd += e.op[k] - (AO[e.opp][k] - lgF[k]); n++; }
                NO[id][k] = n ? (so + lgF[k]*2)/(n + 2) : lgF[k]; ND[id][k] = n ? (sd + lgF[k]*2)/(n + 2) : lgF[k]; } }
              AO = NO; AD = ND; }
            // recent form: last 8 D1 games, opponent-adjusted with the season ratings
            const form = {}; for (const id of teams){ const gs = (byTeam[id] || []).slice().sort((a, b) => a.day < b.day ? 1 : -1).slice(0, 8); if (gs.length < 3) continue;
              let O = 0, D = 0; for (const x of gs){ const home = x.h === id, opp = home ? x.a : x.h, op = R[opp]; if (!op) continue; const poss = possOf(x), adj = x.n ? 0 : (home ? hcaEff : -hcaEff);
                O += ((home ? x._hs : x._as)/poss*100 - adj)*lgEff/op.d; D += ((home ? x._as : x._hs)/poss*100 + adj)*lgEff/op.o; }
              form[id] = { o: O/gs.length, d: D/gs.length, gp: gs.length }; }
            const formRank = Object.keys(form).sort((a, b) => (form[b].o - form[b].d) - (form[a].o - form[a].d)); formRank.forEach((id, i) => form[id].rk = i + 1);
            // transition vs half-court season profile
            const sty = {}; const S0 = () => ({ poss: 0, tp: 0, tpts: 0, hp: 0, hpts: 0, scp: 0, potp: 0, g: 0 });
            for (const x of games){ if (!x.tr) continue; for (const [me, sdM, sdO] of [[x.h, 'h', 'a'], [x.a, 'a', 'h']]){ const q = sty[me] = sty[me] || { o: S0(), d: S0() };
