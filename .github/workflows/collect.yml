# Hoops Lab background collector: saves scores, lines, projections and results for every D1 game.
# Runs every 5 minutes from about 10am to 3am Eastern. History is saved to the "data" branch.
name: Hoops Lab collector

on:
  schedule:
    - cron: '*/5 0-7,15-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoops-lab-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load saved history
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch -q --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
          fi

      - name: Collect games, lines and projections
        env:
          ODDS_PROXY_URL: ${{ vars.ODDS_PROXY_URL }}
          PREFERRED_BOOK: ${{ vars.PREFERRED_BOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_TOTAL_EDGE: ${{ vars.ALERT_TOTAL_EDGE }}
          ALERT_SPREAD_EDGE: ${{ vars.ALERT_SPREAD_EDGE }}
          ALERT_MIN_PROB: ${{ vars.ALERT_MIN_PROB }}
          ALERT_PREGAME: ${{ vars.ALERT_PREGAME }}
          ODDS_LIVE_EVERY_MIN: ${{ vars.ODDS_LIVE_EVERY_MIN }}
          ODDS_PREGAME_EVERY_MIN: ${{ vars.ODDS_PREGAME_EVERY_MIN }}
          FIRST_HALF_DAILY_CAP: ${{ vars.FIRST_HALF_DAILY_CAP }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          cat > /tmp/collector.js <<'HOOPS_EOF'
          // Hoops Lab background collector — runs in GitHub Actions every 5 minutes during game hours.
          // Reuses the dashboard's own data + model code from index.html, and saves history to the "data" branch.
          const fs = require('fs'), path = require('path');
          const DATA = path.resolve(process.env.DATA_DIR || 'data');
          fs.mkdirSync(path.join(DATA, 'days'), { recursive: true });
          const readJ = (f, d) => { try { return JSON.parse(fs.readFileSync(path.join(DATA, f), 'utf8')); } catch { return d; } };
          const writeJ = (f, v) => fs.writeFileSync(path.join(DATA, f), JSON.stringify(v));
          const env = k => (process.env[k] || '').trim();
          const numEnv = (k, d) => { const v = parseFloat(env(k)); return isFinite(v) ? v : d; };

          // localStorage stand-in, saved between runs (caches team history so it isn't re-downloaded every run)
          const cache = readJ('cache.json', {});
          for (const [k, v] of Object.entries(cache)) { try { if (Date.now() - JSON.parse(v).t > 15 * 86400e3) delete cache[k]; } catch { delete cache[k]; } }
          globalThis.localStorage = { getItem: k => (k in cache ? cache[k] : null), setItem: (k, v) => { cache[k] = String(v); }, removeItem: k => { delete cache[k]; } };

          const html = fs.readFileSync(env('INDEX_PATH') || 'index.html', 'utf8');
          const core = html.slice(html.indexOf('<script>') + 8, html.indexOf('/*@@CORE_END@@*/'));
          if (core.length < 1000) throw new Error('Could not find the dashboard code in index.html (missing @@CORE_END@@ marker?)');
          const H = new Function(core + '\nreturn { S, fetchScoreboard, fetchSummary, loadPrior, loadStandings, currentSeason, project, fetchProxyOdds, fetchH1Lines, currentLine, gameElapsed, estPoss, LEAGUE, gameEvents, badBeats, clutchStats };')();
          const { S } = H;
          S.settings.book = env('PREFERRED_BOOK') || 'fanduel';
          S.settings.sims = 1000;

          const etDate = d => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
          const etHour = +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hour12: false }).format(new Date()) % 24;
          const today = etDate(new Date());
          const daysToRun = etHour < 7 ? [etDate(new Date(Date.now() - 86400e3)), today] : [today];
          const forced = env('RUN_DATE'); if (forced) daysToRun.splice(0, daysToRun.length, forced);

          const CPS = [['Pregame', 0], ['Halftime', 1200], ['10:00 left', 1800], ['5:00 left', 2100], ['2:00 left', 2280]];
          const status = { lastRun: new Date().toISOString(), days: daysToRun, live: 0, games: 0, snaps: 0, odds: 0, alerts: 0, errors: [] };
          const perf = readJ('perf.json', []);
          const perfIds = new Set(perf.map(r => r.gid));
          let priorBudget = 120; // max new team-history downloads per run
          const STATE = readJ('state.json', { lastOddsPull: 0, eventIds: {}, lastExtra: {} });
          const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
          const nextDay = d => { const [y, m, dd] = d.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, dd + 1)); return t.toISOString().slice(0, 10); };

          /* ---------- Season game log + opponent-adjusted ratings ---------- */
          function addLog(LOG, ids, g, det, day){
            if (ids.has(g.gid) || !det || !det.hasBox) return;
            const hp = H.estPoss(det.totH), ap = H.estPoss(det.totA);
            if (!hp || !ap || g.home.score == null || g.away.score == null) return;
            const box = t => ({ fga: t.fga, fgm: t.fgm, tpm: t.tpm, tpa: t.tpa, fta: t.fta, ftm: t.ftm, to: t.to, orb: t.orb, drb: t.drb });
            let cl = null; try { const c = H.clutchStats(det, g); if (c && c.any) cl = { hp: c.h.pts, ap: c.a.pts, hpos: c.h.poss, apos: c.a.poss, sec: Math.round(c.sec) }; } catch {}
            LOG.games.push({ gid: g.gid, day, h: g.home.id, a: g.away.id, hs: g.home.score, as: g.away.score, hp: +hp.toFixed(1), ap: +ap.toFixed(1), n: g.neutral ? 1 : 0, ot: g.period > 2 ? g.period - 2 : 0,
              h1: [g.home.lines[0] ?? null, g.away.lines[0] ?? null], h2: [g.home.lines[1] ?? null, g.away.lines[1] ?? null], bh: box(det.totH), ba: box(det.totA), cl });
            ids.add(g.gid);
          }
          async function backfillLog(LOG, ids){
            const season = LOG.season; let budget = 70, dates = 0;
            for (let d = `${season - 1}-11-01`; d < today && dates < 5 && budget > 0; d = nextDay(d)){
              if (LOG.done[d]) continue; dates++;
              let list; try { list = await H.fetchScoreboard(d); } catch (e){ status.errors.push(`backfill ${d}: ${e.message}`); continue; }
              const todo = list.filter(g => g.status === 'post' && !ids.has(g.gid));
              const take = todo.slice(0, budget); budget -= take.length;
              for (const g of take) S.games.set(g.gid, g);
              await Promise.all(take.map(g => H.fetchSummary(g.gid).then(det => addLog(LOG, ids, g, det, d)).catch(() => {})));
              if (take.length === todo.length) LOG.done[d] = true;
              status.backfilled = (status.backfilled || 0) + take.length;
            }
          }
          function prevSeasonStats(id, season){ try { return JSON.parse(cache[`hl.ts.${id}.${season - 1}`]).v || null; } catch { return null; } }
          function computeRatings(LOG){
            const d1 = new Set(S.conf.keys());
            const games = LOG.games.filter(x => (!d1.size || (d1.has(x.h) && d1.has(x.a))) && x.hp && x.ap);
            const possOf = x => (x.hp + x.ap) / 2;
            let pts = 0, ps = 0; for (const x of games){ pts += x.hs + x.as; ps += 2 * possOf(x); }
            const lgEff = games.length > 40 ? pts / ps * 100 : H.LEAGUE.eff;
            const lgT = games.length > 40 ? mean(games.map(x => possOf(x) * 40 / (40 + 5 * x.ot))) : H.LEAGUE.pace;
            const teams = new Set([...d1, ...games.flatMap(x => [x.h, x.a])]);
            const hcaEff = (H.LEAGUE.hcaPts / 2) / lgT * 100;
            const K = 5; // last season counts as 5 games, so current-season results take over within a few weeks
            const prior = {};
            for (const id of teams){ const p = prevSeasonStats(id, LOG.season); const reg = (v, m) => v == null || !isFinite(v) ? m : m + 0.65 * (v - m);
              prior[id] = { o: reg(p && p.ortg, lgEff), d: reg(p && p.drtg, lgEff), t: reg(p && p.pace, lgT), known: !!p }; }
            const byTeam = {}; for (const x of games){ (byTeam[x.h] = byTeam[x.h] || []).push(x); (byTeam[x.a] = byTeam[x.a] || []).push(x); }
            let R = {}; for (const id of teams) R[id] = Object.assign({}, prior[id]);
            const nowT = Date.now();
            for (let it = 0; it < 30; it++){
              const N = {};
              for (const id of teams){
                const pr = prior[id]; let O = pr.o * K, D = pr.d * K, T = pr.t * K, W = K;
                for (const x of byTeam[id] || []){
                  const home = x.h === id, opp = home ? x.a : x.h, op = R[opp] || { o: lgEff, d: lgEff, t: lgT };
                  const mins = (40 + 5 * x.ot) / 40, poss = possOf(x);
                  const ortg = (home ? x.hs : x.as) / poss * 100, drtg = (home ? x.as : x.hs) / poss * 100;
                  const adj = x.n ? 0 : (home ? hcaEff : -hcaEff);
                  const age = (nowT - Date.parse(x.day + 'T12:00:00Z')) / 86400e3, w = Math.pow(0.5, Math.max(0, age) / 45);
                  O += w * (ortg - adj) * lgEff / op.d; D += w * (drtg + adj) * lgEff / op.o; T += w * (poss / mins) * lgT / op.t; W += w;
                }
                N[id] = { o: O / W, d: D / W, t: T / W };
              }
              R = N;
            }
            // Season profiles: strength of schedule, clutch, halftime adjustment, four factors (offense & defense)
            const prof = {};
            const P = id => prof[id] = prof[id] || { sos: [], cl: { pf: 0, pa: 0, pos: 0, opos: 0, g: 0, w: 0, l: 0 }, h1: [], h2: [], o: { fga: 0, fgm: 0, tpm: 0, fta: 0, to: 0, orb: 0, oppDrb: 0, poss: 0 }, d: { fga: 0, fgm: 0, tpm: 0, fta: 0, to: 0, orb: 0, oppDrb: 0, poss: 0 } };
            for (const x of games){
              for (const [me, op, home] of [[x.h, x.a, true], [x.a, x.h, false]]){
                const q = P(me), r = R[op]; if (r) q.sos.push(r.o - r.d);
                if (x.cl){ const pf = home ? x.cl.hp : x.cl.ap, pa = home ? x.cl.ap : x.cl.hp, pos = home ? x.cl.hpos : x.cl.apos, opos = home ? x.cl.apos : x.cl.hpos;
                  q.cl.pf += pf; q.cl.pa += pa; q.cl.pos += pos; q.cl.opos += opos; q.cl.g++; const won = home ? x.hs > x.as : x.as > x.hs; won ? q.cl.w++ : q.cl.l++; }
                if (x.h1 && x.h1[0] != null && x.h2 && x.h2[0] != null){ q.h1.push(home ? x.h1[0] - x.h1[1] : x.h1[1] - x.h1[0]); q.h2.push(home ? x.h2[0] - x.h2[1] : x.h2[1] - x.h2[0]); }
                const mb = home ? x.bh : x.ba, ob = home ? x.ba : x.bh;
                if (mb && ob && mb.fga != null && ob.fga != null){ const add = (t, b, oppB) => { t.fga += b.fga || 0; t.fgm += b.fgm || 0; t.tpm += b.tpm || 0; t.fta += b.fta || 0; t.to += b.to || 0; t.orb += b.orb || 0; t.oppDrb += oppB.drb || 0; t.poss += possOf(x); };
                  add(q.o, mb, ob); add(q.d, ob, mb); }
              }
            }
            const ff = t => t.fga ? { efg: (t.fgm + 0.5*t.tpm)/t.fga, tov: t.poss ? t.to/t.poss : null, orb: (t.orb + t.oppDrb) ? t.orb/(t.orb + t.oppDrb) : null, ftr: t.fta/t.fga } : null;
            const out = {}; const ranked = [...teams].filter(id => d1.has(id) || !d1.size).sort((a, b) => (R[b].o - R[b].d) - (R[a].o - R[a].d));
            const rd = (v, k = 3) => v == null || !isFinite(v) ? null : +v.toFixed(k);
            ranked.forEach((id, i) => { const r = R[id], q = prof[id];
              out[id] = { o: +r.o.toFixed(2), d: +r.d.toFixed(2), t: +r.t.toFixed(2), net: +(r.o - r.d).toFixed(2), rk: i + 1, gp: (byTeam[id] || []).length, prior: prior[id].known ? 1 : 0 };
              if (q){
                if (q.sos.length) out[id].sos = rd(mean(q.sos), 2);
                if (q.cl.g) out[id].cl = { g: q.cl.g, w: q.cl.w, l: q.cl.l, pf: q.cl.pf, pa: q.cl.pa, o: q.cl.pos ? rd(q.cl.pf / q.cl.pos * 100, 1) : null, d: q.cl.opos ? rd(q.cl.pa / q.cl.opos * 100, 1) : null, pos: q.cl.pos };
                if (q.h1.length) out[id].half = { g: q.h1.length, h1: rd(mean(q.h1), 2), h2: rd(mean(q.h2), 2), adj: rd(mean(q.h2) - mean(q.h1), 2) };
                const fo = ff(q.o), fd = ff(q.d); if (fo && fd) out[id].ff = { o: { efg: rd(fo.efg), tov: rd(fo.tov), orb: rd(fo.orb), ftr: rd(fo.ftr) }, d: { efg: rd(fd.efg), tov: rd(fd.tov), orb: rd(fd.orb), ftr: rd(fd.ftr) } };
              } });
            // ranks for SOS
            const sosR = ranked.filter(id => out[id].sos != null).sort((a, b) => out[b].sos - out[a].sos); sosR.forEach((id, i) => out[id].sosRk = i + 1);
            return { updated: Date.now(), season: LOG.season, games: games.length, lg: { eff: +lgEff.toFixed(2), t: +lgT.toFixed(2) }, teams: out,
              method: 'Opponent- and home-court-adjusted offense/defense (points per 100 possessions) and tempo, iterated over every D1-vs-D1 game; last season regressed 35% to average counts as 5 games; recent games weighted more (45-day half-life).' };
          }

          async function runDay(day){
            S.date = day; S.games.clear(); S.details.clear(); S.extraOdds.clear(); S.proj.clear();
            const file = `days/${day}.json`;
            const D = readJ(file, { day, games: {}, snaps: [], odds: [], state: { oddsSig: {}, lastPre: {}, alerts: {} } });
            D.state = Object.assign({ oddsSig: {}, lastPre: {}, alerts: {} }, D.state || {});
            let list;
            try { list = await H.fetchScoreboard(day); } catch (e){ status.errors.push(`${day} scoreboard: ${e.message}`); return; }
            for (const g of list){ const m = D.games[g.gid]; if (m && m.pregameLine) g.pregameLine = m.pregameLine; S.games.set(g.gid, g); }
            status.games += list.length;
            const st = await H.loadStandings(H.currentSeason()); if (st) for (const [id, c] of Object.entries(st.conf)) S.conf.set(id, c);
            const now = Date.now();
            const live = list.filter(g => g.status === 'in' || g.status === 'half');
            const soon = list.filter(g => g.status === 'pre' && Date.parse(g.date) - now < 3 * 3600e3);
            const finishing = list.filter(g => g.status === 'post' && !(D.games[g.gid] && D.games[g.gid].final));
            status.live += live.length;

            // Team history (needed for projections + luck)
            for (const g of [...live, ...soon, ...finishing, ...list.filter(x => x.status === 'pre')]){
              for (const t of [g.home, g.away]){
                if (S.priors.has(t.id)) continue;
                const cached = Object.keys(cache).some(k => k.startsWith(`hl.ts.${t.id}.`));
                if (!cached){ if (priorBudget <= 0) continue; priorBudget--; }
                await H.loadPrior(t.id);
              }
            }
            // Box scores + play-by-play for live games and games that just went final
            await Promise.all([...live, ...finishing].map(g => H.fetchSummary(g.gid).catch(e => status.errors.push(`summary ${g.gid}: ${e.message}`))));
            // Sportsbook lines from your Cloudflare Worker (only when games are live or about to start)
            const proxy = env('ODDS_PROXY_URL');
            // Odds pulls: every ODDS_LIVE_EVERY_MIN (default 10) while games are live, every ODDS_PREGAME_EVERY_MIN (default 60) otherwise
            const everyMin = live.length ? numEnv('ODDS_LIVE_EVERY_MIN', 10) : numEnv('ODDS_PREGAME_EVERY_MIN', 60);
            if (proxy) S.settings.proxy = proxy;
            if (proxy && (live.length || soon.length) && now - (STATE.lastOddsPull || 0) >= everyMin * 60e3 - 30e3){
              await H.fetchProxyOdds(); STATE.lastOddsPull = now; status.oddsPulled = true;
              if (S.health.proxy.err && (S.health.proxy.errAt || 0) > (S.health.proxy.ok || 0)) status.errors.push('odds feed: ' + S.health.proxy.err);
              if (S.oddsQuota) status.credits = S.oddsQuota.remaining;
              for (const [gid, list] of S.extraOdds) STATE.lastExtra[gid] = list;
              for (const [gid, id] of S.oddsEventId) STATE.eventIds[gid] = id;
            } else {
              // reuse the last pulled lines between pulls (their timestamps show how old they are)
              for (const g of list) if (STATE.lastExtra[g.gid]) S.extraOdds.set(g.gid, STATE.lastExtra[g.gid]);
            }
            for (const g of list) if (STATE.eventIds[g.gid]) S.oddsEventId.set(g.gid, STATE.eventIds[g.gid]);
            // First-half lines: one pull per game, 15-75 minutes before tip, capped per day (FIRST_HALF_DAILY_CAP, default 40; 0 = off)
            const h1Cap = numEnv('FIRST_HALF_DAILY_CAP', 40);
            D.state.h1 = D.state.h1 || {};
            if (proxy && h1Cap > 0){
              const cand = list.filter(g => g.status === 'pre' && S.oddsEventId.has(g.gid) && !D.state.h1[g.gid] && Date.parse(g.date) - now < 75 * 60e3 && Date.parse(g.date) - now > 15 * 60e3)
                .sort((a, b) => ((b.home.rank || b.away.rank) ? 1 : 0) - ((a.home.rank || a.away.rank) ? 1 : 0) || Date.parse(a.date) - Date.parse(b.date));
              const used = Object.keys(D.state.h1).length;
              for (const g of cand.slice(0, Math.max(0, h1Cap - used))){
                const L = await H.fetchH1Lines(g.gid); D.state.h1[g.gid] = now;
                if (L && L.length){ D.games[g.gid] = Object.assign(D.games[g.gid] || {}, { h1Lines: L }); status.h1 = (status.h1 || 0) + 1; }
              }
            }
            for (const g of list){ const m = D.games[g.gid]; if (m && m.h1Lines) S.h1Lines.set(g.gid, m.h1Lines); }

            for (const g of list){
              const meta = D.games[g.gid] = Object.assign(D.games[g.gid] || {}, { gid: g.gid, day, date: g.date, home: g.home.name, away: g.away.name, homeAbbr: g.home.abbr, awayAbbr: g.away.abbr, homeId: g.home.id, awayId: g.away.id,
                conf: (S.conf.get(g.home.id) || {}).abbr || '', confAway: (S.conf.get(g.away.id) || {}).abbr || '', status: g.status, h: g.home.score, a: g.away.score, period: g.period, updated: now });
              // Line history (saved only when a number changes)
              const det = S.details.get(g.gid);
              const lines = [...((det && det.pick && det.pick.length) ? det.pick.slice(0, 1) : g.odds ? [g.odds] : []), ...(S.extraOdds.get(g.gid) || [])];
              for (const o of lines){
                const src = o.src + '|' + o.book, sig = [o.homeSpread, o.total, o.mlH, o.mlA].join(',');
                if (D.state.oddsSig[g.gid + '|' + src] === sig) continue; D.state.oddsSig[g.gid + '|' + src] = sig;
                D.odds.push({ gid: g.gid, src, ts: now, status: g.status, el: H.gameElapsed(g), homeSpread: o.homeSpread, total: o.total, mlH: o.mlH, mlA: o.mlA, h: g.home.score, a: g.away.score }); status.odds++;
              }
              if (g.status === 'other') continue;
              if (g.status === 'post'){
                if (!meta.final && det){
                  meta.final = true; meta.ot = g.period > 2; meta.totH = det.totH; meta.totA = det.totA;
                  meta.finalPoss = det.poss ? (det.poss.h + det.poss.a) / 2 : ((H.estPoss(det.totH) || 0) + (H.estPoss(det.totA) || 0)) / 2 || null;
                  addPerf(D, meta, g);
                  addLog(LOG, LOG_IDS, g, det, day);
                }
                continue;
              }
              let p; try { p = H.project(g); } catch (e){ status.errors.push(`project ${g.gid}: ${e.message}`); continue; }
              if (!p || p.projT == null) continue;
              if (g.status === 'pre'){
                const ln = H.currentLine(g); if (ln){ meta.pregameLine = { total: ln.total, homeSpread: ln.homeSpread, mlH: ln.mlH, mlA: ln.mlA, book: ln.book }; }
                if (now - (D.state.lastPre[g.gid] || 0) < 30 * 60e3) { await checkAlerts(D, g, p); continue; }
                D.state.lastPre[g.gid] = now;
              }
              D.snaps.push({ gid: g.gid, ts: now, el: p.el, status: g.status, h: g.home.score, a: g.away.score, projH: p.projH, projA: p.projA, projT: p.projT, projM: p.projM,
                pHome: p.pHome, pOver: p.pOver ?? null, pCoverH: p.pCoverH ?? null, lineTotal: p.line?.total ?? null, lineSpread: p.line?.homeSpread ?? null, book: p.line?.book ?? null,
                projPoss: p.projPossH != null ? (p.projPossH + p.projPossA) / 2 : null, naiveT: p.naiveT, luckH: p.luckH?.luck ?? null, luckA: p.luckA?.luck ?? null, src: 'collector',
                ...(p.h1 && !p.h1.final ? { projH1T: p.h1.projT, projH1M: p.h1.projM, lineH1Total: p.h1.line?.total ?? null, lineH1Spread: p.h1.line?.homeSpread ?? null } : {}) });
              status.snaps++;
              await checkAlerts(D, g, p);
            }
            // Feed: comebacks, late finishes, overtime and bad beats (from play-by-play)
            D.feed = D.feed || {};
            for (const g of [...live, ...finishing]){ const det = S.details.get(g.gid); if (!det) continue;
              try { for (const e of [...H.gameEvents(g, det), ...H.badBeats(g, det)]) D.feed[e.key] = e; } catch (e){ status.errors.push(`feed ${g.gid}: ${e.message}`); } }
            // drop live-only items that no longer apply (e.g. a comeback that was reversed)
            for (const [k, e] of Object.entries(D.feed)){ const g = S.games.get(e.gid); if (!g || g.status === 'post') continue; const det = S.details.get(e.gid); if (det && !H.gameEvents(g, det).some(x => x.key === k)) delete D.feed[k]; }
            D.updated = now;
            writeJ(file, D);
          }

          function addPerf(D, meta, g){
            if (perfIds.has(meta.gid) || meta.h == null || meta.a == null) return;
            const arr = D.snaps.filter(s => s.gid === meta.gid).sort((a, b) => a.ts - b.ts);
            if (!arr.length) return;
            const cps = {};
            for (const [name, el] of CPS){
              let s = null;
              if (el === 0) s = arr.filter(x => x.status === 'pre').pop() || (arr[0].el < 60 ? arr[0] : null);
              else { for (const x of arr) if (x.status !== 'pre' && x.el <= el + 1 && (!s || x.el >= s.el)) s = x; if (s && s.el < el - 240) s = null; }
              if (s) cps[name] = { el: s.el, h: s.h, a: s.a, projT: s.projT, projM: s.projM, pHome: s.pHome, naiveT: s.naiveT, lineTotal: s.lineTotal, lineSpread: s.lineSpread, projPoss: s.projPoss,
                ...(s.projH1T != null ? { projH1T: s.projH1T, projH1M: s.projH1M, lineH1Total: s.lineH1Total, lineH1Spread: s.lineH1Spread } : {}) };
            }
            perf.push({ gid: meta.gid, day: meta.day, home: meta.home, away: meta.away, conf: meta.conf, h: meta.h, a: meta.a, finalPoss: meta.finalPoss, ot: !!meta.ot, pregameLine: meta.pregameLine || null, cps, n: arr.length,
              h1H: g && g.home.lines.length ? g.home.lines[0] : null, h1A: g && g.away.lines.length ? g.away.lines[0] : null });
            perfIds.add(meta.gid);
          }

          /* ---------- #3 Edge alerts to your phone (ntfy). Off until the NTFY_TOPIC secret is added. ---------- */
          async function checkAlerts(D, g, p){
            const topic = env('NTFY_TOPIC'); if (!topic || !p.line) return;
            const live = g.status === 'in' || g.status === 'half';
            if (g.status === 'pre' && env('ALERT_PREGAME').toLowerCase() !== 'yes') return;
            if (live && p.el < 240) return; // skip the first 4 minutes (too little data)
            // Live games: only alert against a genuinely live line from your sportsbook feed, updated in the last 15 minutes
            if (live && (!String(p.line.src || '').startsWith('proxy:') || Date.now() - (p.line.ts || 0) > 15 * 60e3)) return;
            const minEdgeT = numEnv('ALERT_TOTAL_EDGE', 4), minEdgeS = numEnv('ALERT_SPREAD_EDGE', 3), minProb = numEnv('ALERT_MIN_PROB', 0.6);
            const A = g.away.abbr, Hm = g.home.abbr, ln = p.line, out = [];
            if (ln.total != null && p.pOver != null){
              const edge = p.projT - ln.total, side = edge > 0 ? 'OVER' : 'UNDER', prob = edge > 0 ? p.pOver : 1 - p.pOver - (p.pPushT || 0);
              if (Math.abs(edge) >= minEdgeT && prob >= minProb) out.push({ key: 'total|' + side, edge: Math.abs(edge), text: `${side} ${ln.total} (${ln.book}) · model ${p.projT.toFixed(1)} · ${Math.round(prob * 100)}%` });
            }
            if (ln.homeSpread != null && p.pCoverH != null){
              const edge = p.projM + ln.homeSpread, team = edge > 0 ? g.home : g.away, spread = edge > 0 ? ln.homeSpread : -ln.homeSpread;
              const prob = edge > 0 ? p.pCoverH : 1 - p.pCoverH - (p.pPush || 0);
              if (Math.abs(edge) >= minEdgeS && prob >= minProb) out.push({ key: 'spread|' + team.abbr, edge: Math.abs(edge), text: `${team.abbr} ${spread > 0 ? '+' : ''}${spread} (${ln.book}) · model margin ${Hm} ${p.projM > 0 ? '+' : ''}${p.projM.toFixed(1)} · ${Math.round(prob * 100)}%` });
            }
            for (const a of out){
              const k = g.gid + '|' + a.key, prev = D.state.alerts[k];
              if (prev && (a.edge < prev.edge + 2 || Date.now() - prev.ts < 10 * 60e3)) continue; // once per edge; again only if it grows 2+ pts
              D.state.alerts[k] = { edge: a.edge, ts: Date.now() };
              const clock = g.status === 'pre' ? 'Pregame' : g.status === 'half' ? 'Halftime' : `${g.period > 2 ? 'OT' : g.period === 1 ? '1H' : '2H'} ${g.displayClock}`;
              const body = `${A} ${g.away.score ?? ''} @ ${Hm} ${g.home.score ?? ''} · ${clock}\n${a.text}\nEdge ${a.edge.toFixed(1)} pts (model estimate, not a guarantee)`;
              try {
                const r = await fetch('https://ntfy.sh/' + encodeURIComponent(topic), { method: 'POST', body,
                  headers: { Title: `Hoops Lab edge: ${A} @ ${Hm}`, Tags: 'basketball', Priority: a.edge >= 6 ? 'high' : 'default', ...(env('DASHBOARD_URL') ? { Click: env('DASHBOARD_URL') + '?date=' + D.day } : {}) } });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                status.alerts++;
                (D.alerts = D.alerts || []).push({ gid: g.gid, ts: Date.now(), text: body.replace(/\n/g, ' · ') });
              } catch (e){ status.errors.push('ntfy: ' + e.message); }
            }
          }

          let LOG, LOG_IDS;
          (async () => {
            S.date = today;
            const season = H.currentSeason();
            LOG = readJ('log.json', null); if (!LOG || LOG.season !== season || LOG.v !== 2) LOG = { season, v: 2, done: {}, games: [] };
            LOG_IDS = new Set(LOG.games.map(x => x.gid));
            const st = await H.loadStandings(season); if (st) for (const [id, c] of Object.entries(st.conf)) S.conf.set(id, c);
            await backfillLog(LOG, LOG_IDS);
            S.games.clear(); S.details.clear();
            // make sure last-season stats are cached for the rating priors (spread over runs)
            for (const id of S.conf.keys()){ if (priorBudget <= 0) break; if (!cache[`hl.ts.${id}.${season - 1}`]){ priorBudget--; await H.loadPrior(id); } }
            const ratings = computeRatings(LOG); S.ratings = ratings; writeJ('ratings.json', ratings); status.ratedGames = ratings.games;
            for (const d of daysToRun) await runDay(d);
            writeJ('log.json', LOG); writeJ('state.json', STATE);
            writeJ('perf.json', perf);
            const idx = new Set(readJ('days/index.json', [])); daysToRun.forEach(d => idx.add(d)); writeJ('days/index.json', [...idx].sort());
            writeJ('cache.json', cache);
            writeJ('status.json', status);
            console.log(JSON.stringify(status, null, 1));
          })().catch(e => { console.error(e); process.exit(1); });

          HOOPS_EOF
          node /tmp/collector.js

      - name: Save history to the data branch
        run: |
          cd data
          rm -rf .git
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="hoops-lab-bot" -c user.email="hoops-lab-bot@users.noreply.github.com" commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
