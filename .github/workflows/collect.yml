            const closeO = odds[odds.length - 1], lastSnap = pre[pre.length - 1];
            const Lc = closeO && closeO.homeSpread != null ? closeO.homeSpread : lastSnap.lineSpread, Tc = closeO && closeO.total != null ? closeO.total : lastSnap.lineTotal;
            const out = { book: book || '' }, M = meta.h - meta.a, T = meta.h + meta.a;
            if (pick.lineSpread != null && pick.projM != null && Lc != null){ const Lp = pick.lineSpread, e = pick.projM + Lp, side = e > 0 ? 'h' : 'a';
              const clv = side === 'h' ? Lp - Lc : Lc - Lp, cov = M + Lp; const res = cov === 0 ? 'P' : (cov > 0) === (side === 'h') ? 'W' : 'L';
              out.sp = { side, edge: +Math.abs(e).toFixed(2), lp: Lp, lc: Lc, clv: +clv.toFixed(2), res }; }
            if (pick.lineTotal != null && pick.projT != null && Tc != null){ const Tp = pick.lineTotal, e = pick.projT - Tp, side = e > 0 ? 'o' : 'u';
              const clv = side === 'o' ? Tc - Tp : Tp - Tc; const res = T === Tp ? 'P' : (T > Tp) === (side === 'o') ? 'W' : 'L';
              out.to = { side, edge: +Math.abs(e).toFixed(2), lp: Tp, lc: Tc, clv: +clv.toFixed(2), res }; }
            return out.sp || out.to ? out : null;
          }

          function addPerf(D, meta, g){
            if (perfIds.has(meta.gid) || meta.h == null || meta.a == null) return;
            const arr = D.snaps.filter(s => s.gid === meta.gid).sort((a, b) => a.ts - b.ts);
            if (!arr.length) return;
            const cps = {};
            for (const [name, el] of CPS){
              let s = null;
              if (el === 0) s = arr.filter(x => x.status === 'pre').pop() || (arr[0].el < 60 ? arr[0] : null);
              else { for (const x of arr) if (x.status !== 'pre' && x.el <= el + 1 && (!s || x.el >= s.el)) s = x; if (s && s.el < el - 240) s = null; }
              if (s) cps[name] = { el: s.el, h: s.h, a: s.a, projT: s.projT, projM: s.projM, pHome: s.pHome, naiveT: s.naiveT, lineTotal: s.lineTotal, lineSpread: s.lineSpread, projPoss: s.projPoss,
                ...(s.projH1T != null ? { projH1T: s.projH1T, projH1M: s.projH1M, lineH1Total: s.lineH1Total, lineH1Spread: s.lineH1Spread } : {}), ...(s.preM ? { preM: s.preM, preR: s.preR } : {}), ...(s.ta != null ? { ta: s.ta, dk: s.dk } : {}) };
            }
            const D1s = new Set(S.conf.keys());
            perf.push({ gid: meta.gid, d1: g && D1s.size ? D1s.has(String(g.home.id)) && D1s.has(String(g.away.id)) : undefined, day: meta.day, home: meta.home, away: meta.away, conf: meta.conf, h: meta.h, a: meta.a, finalPoss: meta.finalPoss, ot: !!meta.ot, pregameLine: meta.pregameLine || null, cps, n: arr.length,
              h1H: g && g.home.lines.length ? g.home.lines[0] : null, h1A: g && g.away.lines.length ? g.away.lines[0] : null, clv: clvFor(D, meta) });
            perfIds.add(meta.gid);
          }

          /* ---------- #3 Edge alerts to your phone (ntfy). Off until the NTFY_TOPIC secret is added. ---------- */
          async function checkAlerts(D, g, p){
            const topic = env('NTFY_TOPIC'); if (!topic || !p.line) return;
            const live = g.status === 'in' || g.status === 'half';
            if (g.status === 'pre' && env('ALERT_PREGAME').toLowerCase() !== 'yes') return;
            if (live && p.el < 240) return; // skip the first 4 minutes (too little data)
            // Live games: only alert against a genuinely live line from your sportsbook feed, updated in the last 15 minutes
            if (live && (!String(p.line.src || '').startsWith('proxy:') || Date.now() - (p.line.ts || 0) > 15 * 60e3)) return;
            const minEdgeT = numEnv('ALERT_TOTAL_EDGE', 4), minEdgeS = numEnv('ALERT_SPREAD_EDGE', 3), minProb = numEnv('ALERT_MIN_PROB', 0.6);
            const A = g.away.abbr, Hm = g.home.abbr, ln = p.line, out = [];
            if (ln.total != null && p.pOver != null){
              const edge = p.projT - ln.total, side = edge > 0 ? 'OVER' : 'UNDER', prob = edge > 0 ? p.pOver : 1 - p.pOver - (p.pPushT || 0);
              if (Math.abs(edge) >= minEdgeT && prob >= minProb) out.push({ key: 'total|' + side, edge: Math.abs(edge), text: `${side} ${ln.total} (${ln.book}) · model ${p.projT.toFixed(1)} · ${Math.round(prob * 100)}%` });
            }
            if (ln.homeSpread != null && p.pCoverH != null){
              const edge = p.projM + ln.homeSpread, team = edge > 0 ? g.home : g.away, spread = edge > 0 ? ln.homeSpread : -ln.homeSpread;
              const prob = edge > 0 ? p.pCoverH : 1 - p.pCoverH - (p.pPush || 0);
              if (Math.abs(edge) >= minEdgeS && prob >= minProb) out.push({ key: 'spread|' + team.abbr, edge: Math.abs(edge), text: `${team.abbr} ${spread > 0 ? '+' : ''}${spread} (${ln.book}) · model margin ${Hm} ${p.projM > 0 ? '+' : ''}${p.projM.toFixed(1)} · ${Math.round(prob * 100)}%` });
            }
            for (const a of out){
              const k = g.gid + '|' + a.key, prev = D.state.alerts[k];
              if (prev && (a.edge < prev.edge + 2 || Date.now() - prev.ts < 10 * 60e3)) continue; // once per edge; again only if it grows 2+ pts
              D.state.alerts[k] = { edge: a.edge, ts: Date.now() };
              const clock = g.status === 'pre' ? 'Pregame' : g.status === 'half' ? 'Halftime' : `${g.period > 2 ? 'OT' : g.period === 1 ? '1H' : '2H'} ${g.displayClock}`;
              const body = `${A} ${g.away.score ?? ''} @ ${Hm} ${g.home.score ?? ''} · ${clock}\n${a.text}\nEdge ${a.edge.toFixed(1)} pts (model estimate, not a guarantee)`;
              try {
                const r = await fetch('https://ntfy.sh/' + encodeURIComponent(topic), { method: 'POST', body,
                  headers: { Title: `Hoops Lab edge: ${A} @ ${Hm}`, Tags: 'basketball', Priority: a.edge >= 6 ? 'high' : 'default', ...(env('DASHBOARD_URL') ? { Click: env('DASHBOARD_URL') + '?date=' + D.day } : {}) } });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                status.alerts++;
                (D.alerts = D.alerts || []).push({ gid: g.gid, ts: Date.now(), text: body.replace(/\n/g, ' · ') });
              } catch (e){ status.errors.push('ntfy: ' + e.message); }
            }
          }

          let LOG, LOG_IDS;
          (async () => {
            S.date = today;
            const season = H.currentSeason();
            LOG = readJ('log.json', null); let fresh = false; if (!LOG || LOG.season !== season || LOG.v !== 3){ LOG = { season, v: 3, done: {}, games: [] }; fresh = true; }
            PLAYERS = fresh ? null : readJ('players.json', null); if (!PLAYERS || PLAYERS.season !== season) PLAYERS = { season, players: {} };
            CALIB = readJ('calib.json', null); if (CALIB) H.applyCalib(CALIB);
            S.shotModel = readJ('shotmodel.json', null);
            LOG_IDS = new Set(LOG.games.map(x => x.gid));
            const st = await H.loadStandings(season); if (st) for (const [id, c] of Object.entries(st.conf)) S.conf.set(id, c);
            await backfillLog(LOG, LOG_IDS);
            S.games.clear(); S.details.clear();
            // make sure last-season stats are cached for the rating priors (spread over runs)
            for (const id of S.conf.keys()){ if (priorBudget <= 0) break; if (!cache[`hl.ts.${id}.${season - 1}`]){ priorBudget--; await H.loadPrior(id); } }
            const ratings = computeRatings(LOG); S.ratings = ratings; status.ratedGames = ratings.games;
            computeImpacts();
            // shot model: D1 make rates by zone from every logged shot location
            const bins = {}; for (const x of LOG.games) if (x.sq) for (const sd of ['h', 'a']) for (const [b, [a, m]] of Object.entries(x.sq[sd] || {})){ bins[b] = bins[b] || { a: 0, m: 0 }; bins[b].a += a; bins[b].m += m; }
            S.shotModel = { updated: Date.now(), bins }; writeJ('shotmodel.json', S.shotModel);
            { const D1s = new Set(S.conf.keys()); if (D1s.size){ const byG = new Map(LOG.games.map(x => [x.gid, x]));
              for (const r of perf) if (r.d1 === undefined){ const x = byG.get(r.gid); if (x) r.d1 = D1s.has(String(x.h)) && D1s.has(String(x.a)); } } } // tag older results D1-vs-D1 or not
            CALIB = calibrate(ratings); H.applyCalib(CALIB); writeJ('calib.json', CALIB);
            // Daily rating history (net, rank, off, def, tempo per team) for trend lines; backfills missing days from the game log
            const HIST = readJ('ratings-history.json', null);
            const hist = HIST && HIST.season === season ? HIST : { season, days: {} };
            const firstDay = LOG.games.reduce((m, x) => !m || x.day < m ? x.day : m, null);
            if (firstDay){ let budgetDays = 12;
              for (let d = firstDay; d < today && budgetDays > 0; d = nextDay(d)){ if (hist.days[d]) continue; const r = computeRatings(LOG, d, true); hist.days[d] = { games: r.games, t: r.teams }; budgetDays--; } }
            const cur = {}; for (const [id, r] of Object.entries(ratings.teams)) cur[id] = [r.net, r.rk, +r.o.toFixed(1), +r.d.toFixed(1), +r.t.toFixed(1)];
            hist.days[today] = { games: ratings.games, t: cur };
            writeJ('ratings-history.json', hist);
            // 7-day rank change for the rankings table
            const wk = Object.keys(hist.days).filter(d => d <= (() => { const t = new Date(today + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() - 7); return t.toISOString().slice(0, 10); })()).sort().pop();
            if (wk) for (const [id, r] of Object.entries(ratings.teams)){ const old = hist.days[wk].t[id]; if (old) r.rk7 = old[1] - r.rk; }
            writeJ('ratings.json', ratings);
            for (const d of daysToRun) await runDay(d);
            writeJ('log.json', LOG); writeJ('state.json', STATE);
            computeImpacts(); PLAYERS.updated = Date.now(); writeJ('players.json', PLAYERS);
            writeJ('perf.json', perf);
            const idx = new Set(readJ('days/index.json', [])); daysToRun.forEach(d => idx.add(d)); writeJ('days/index.json', [...idx].sort());
            writeJ('cache.json', cache);
            writeJ('status.json', status);
            console.log(JSON.stringify(status, null, 1));
          })().catch(e => { console.error(e); process.exit(1); });
          HOOPS_EOF
          node /tmp/collector.js

      - name: Save history to the data branch
        run: |
          cd data
          rm -rf .git
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="hoops-lab-bot" -c user.email="hoops-lab-bot@users.noreply.github.com" commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
